
name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # 1. Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Python 3.10
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Java 17 (Gradle için gerekli)
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 4. Java kontrolü
      - name: Verify Java
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      # 5. Sistem bağımlılıkları
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            build-essential

      # 6. Buildozer kurulumu
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer cython==0.29.36 virtualenv

      # 7. Buildozer cache
      - name: Cache Buildozer Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      # 8. Dosya kontrolleri
      - name: Check Project Files
        run: |
          test -f buildozer.spec || {
            echo "HATA: buildozer.spec bulunamadi!"
            exit 1
          }

          test -f main.py || {
            echo "HATA: main.py bulunamadi!"
            exit 1
          }

          echo "Proje dosyalari kontrol edildi."

      # 9. Android SDK lisans dizini
      - name: Prepare Android Environment
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg

      # 10. APK derleme
      - name: Build APK with Buildozer
        run: |
          buildozer -v android debug

      # 11. APK kontrolü
      - name: Check APK
        run: |
          if ls bin/*.apk 1>/dev/null 2>&1; then
            echo "APK basariyla olusturuldu:"
            ls -lh bin/*.apk
          else
            echo "HATA: APK olusturulamadi!"
            exit 1
          fi

      # 12. APK indirme
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Android-APK
          path: bin/*.apk
          retention-days: 7

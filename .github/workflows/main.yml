name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
          zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev

      - name: Install Buildozer & Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython virtualenv

      - name: Cache Buildozer Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-

      - name: Validate buildozer.spec
        run: test -f buildozer.spec || (echo "HATA: buildozer.spec bulunamadi!" && exit 1)

      - name: Set Android Environment Variables
        run: |
          echo "ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk" >> $GITHUB_ENV
          echo "PATH=$PATH:$HOME/.buildozer/android/platform/android-sdk/tools:$HOME/.buildozer/android/platform/android-sdk/platform-tools" >> $GITHUB_ENV

      - name: Accept Android Licenses
        run: |
          mkdir -p ~/.android
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > ~/.android/repositories.cfg
          yes | buildozer android debug 2>/dev/null || true

      - name: Build APK with Buildozer
        run: buildozer -v android debug

      - name: Check APK exists
        run: |
          if ls bin/*.apk 1>/dev/null 2>&1; then
            echo "APK basariyla olusturuldu:"
            ls -lh bin/*.apk
          else
            echo "HATA: APK olusturulamadi!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: jarvis-debug-apk
          path: bin/*.apk
          retention-days: 7
